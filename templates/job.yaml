apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openchoreo-single.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "openchoreo-single.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.installer.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.installer.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openchoreo-single.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "openchoreo-single.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: installer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/install.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: values
              mountPath: /config
      volumes:
        - name: script
          configMap:
            name: {{ include "openchoreo-single.fullname" . }}-script
            defaultMode: 0755
        - name: values
          configMap:
            name: {{ include "openchoreo-single.fullname" . }}-values
